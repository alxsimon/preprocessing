# global variables of the pipeline

container: container/preprocessing_container.sif
samples: resources/samples_info.tsv
ref_fasta: ref_genome/mgal_01.fa
threads: 26

hiseq_rg1: "L001"
hiseq_rg2: "L002"

novaseq_rg1: "AH52GLDSXX"
novaseq_rg2: "AH52HJDSXX"

# fastp global parameters
fastp_complexity_threshold: 20
fastp_P: 100
adapter_fasta: resources/adapters.fa

# baw parameters
bwa_k: 13
bwa_B: 4
bwa_O: 4
bwa_L: 3

# Memory parameters in Gb
samtools_sort_m: 2
gatk_java_heap_mem: 8
